<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Boceto franja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD51F;--k:#0d0d0d;--fs:clamp(56px,7vw,104px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--k);color:#fff;font-family:'Bebas Neue',sans-serif}
h1,h2{font-weight:400;letter-spacing:.04em;text-align:center}
h1{font-size:clamp(34px,6vw,60px);color:var(--y);padding:34px 16px 6px}
.intro{font:15px/1.4 system-ui,sans-serif;color:#bbb;text-align:center;max-width:640px;margin:0 auto 10px;padding:0 16px}
h2{font-size:clamp(26px,4.4vw,44px);color:#fff;margin:46px 16px 14px}
h2 span{color:var(--y)}

/* ===== Desgaste sacado del propio escudo ===== */
.gr{--m:url(desgaste.png);-webkit-mask-image:var(--m),var(--m),var(--m);mask-image:var(--m),var(--m),var(--m);
  -webkit-mask-size:auto 100%,auto 130%,auto 85%;mask-size:auto 100%,auto 130%,auto 85%;
  -webkit-mask-position:0 0,41% 30%,73% 80%;mask-position:0 0,41% 30%,73% 80%;
  -webkit-mask-repeat:repeat;mask-repeat:repeat;
  -webkit-mask-composite:source-in;mask-composite:intersect;filter:url(#edge)}
.bar{height:12px;background:var(--k);-webkit-mask:url(barra.png) center/100% 100% no-repeat;mask:url(barra.png) center/100% 100% no-repeat}
.bar.clean{-webkit-mask:none;mask:none;height:6px}

/* ===== Franja ===== */
.st{position:relative;padding:28px 0;overflow:hidden}
.band{position:absolute;left:-24px;right:-24px;top:28px;bottom:28px;background:var(--y);filter:url(#torn)}
.in{position:relative;max-width:1440px;margin:0 auto;padding:clamp(26px,3vw,40px) 16px;display:grid;grid-template-columns:clamp(100px,11vw,170px) minmax(0,1fr) clamp(100px,11vw,170px);align-items:center}
.fig{display:flex;justify-content:center}.fig img{width:86%;max-width:160px}
.fig.r img{transform:scaleX(-1)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 10px;position:relative}
.it+.it::before{content:"";position:absolute;left:0;top:6%;bottom:6%;width:7px;background:var(--k);opacity:.85;
  -webkit-mask:url(barra.png) center/100% 100% no-repeat;mask:url(barra.png) center/100% 100% no-repeat;transform:rotate(180deg)}
.n{height:calc(var(--fs)*.92);display:flex;align-items:flex-end;justify-content:center}
.n b{font-weight:400;font-size:var(--fs);line-height:.85;color:var(--k);white-space:nowrap;letter-spacing:.01em;transform:scaleX(1.1);display:inline-block}
.n b small{font-size:.58em;margin:0 .12em}
.it .bar{width:78%;margin:14px auto 12px}
.l{font-size:clamp(18px,1.9vw,27px);line-height:1.02;letter-spacing:.05em;color:var(--k);text-transform:uppercase;transform:scaleX(1.06)}
.stars{font:clamp(12px,1.2vw,16px)/1 system-ui;letter-spacing:.2em;background:var(--k);color:#fff;padding:.45em .8em;margin:0 0 calc(var(--fs)*.12) 8px}

/* V3: placas negras con número amarillo */
.v3 .it+.it::before{display:none}
.v3 .n{position:relative;padding:0 .22em}
.v3 .n::before{content:"";position:absolute;inset:8% -6% -6% -6%;background:var(--k);filter:url(#torn2)}
.v3 .n b{position:relative;color:var(--y)}
.v3 .bar{background:var(--k);height:16px;width:90%}

@media(max-width:1100px){.in{grid-template-columns:minmax(0,1fr)}.fig{display:none}}
@media(max-width:760px){
  :root{--fs:clamp(52px,15vw,74px)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:30px}
  .it:nth-child(odd)::before{display:none}
  .l{font-size:19px}
}

/* ===== Escudos ===== */
.shields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1200px;margin:0 auto;padding:0 16px 60px}
.sh{background:#000;border:1px solid #222;padding:18px 10px 14px;text-align:center}
.sh svg{width:100%;height:auto;display:block}
.sh p{font-size:26px;color:var(--y);margin-top:8px;letter-spacing:.05em}
.sh small{display:block;font:14px/1.35 system-ui,sans-serif;color:#aaa;margin-top:4px;padding:0 6px}
@media(max-width:860px){.shields{grid-template-columns:1fr;max-width:460px}}
</style>
<style>
.fig img{width:100%;max-width:150px}.fig.r img{transform:none}
@media(max-width:1100px){.in{grid-template-columns:minmax(0,1fr)}.fig{display:flex;margin-bottom:22px}.fig.r{display:none}.fig img{max-width:110px}}
body{padding:40px 0}.it{padding:0 16px}@media(max-width:760px){.stars{font-size:10px;padding:.4em .5em;letter-spacing:.12em}.it{padding:0 8px}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="edge" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="o"/><feDisplacementMap in="SourceGraphic" in2="o" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="torn" x="-3%" y="-30%" width="106%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.09 0.02" numOctaves="4" seed="7" result="r"/><feDisplacementMap in="SourceGraphic" in2="r" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="torn2" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.07 0.03" numOctaves="4" seed="9" result="r"/><feDisplacementMap in="SourceGraphic" in2="r" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter>
  <symbol id="shield" viewBox="620 290 1030 1060"><path d="M1133 318 Q905 425 670 484 C660 640 676 780 720 880 C800 1070 960 1240 1133 1308 C1306 1240 1466 1070 1546 880 C1590 780 1606 640 1596 484 Q1361 425 1133 318 Z" fill="none" stroke="#FFD51F" stroke-width="36" stroke-linejoin="miter"/></symbol>
  <mask id="wear" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1100"><rect width="1000" height="1100" fill="#fff"/><image href="agujeros.png" x="0" y="430" width="1000" height="400" preserveAspectRatio="none"/></mask>
</defs></svg>

<h1>Boceto · Franja versión 1 + escudo C</h1>
<!-- V1 -->

<div class="st v1"><div class="band"></div><div class="in">
  <div class="fig"><img src="escudo-1a1.png" alt="Escudo 1 a 1"></div>
  <div class="grid">
    <div class="it"><div class="n"><b class="gr">1<small>a</small>1</b></div><i class="bar"></i><div class="l">1 cliente por<br>1 entrenador personal</div></div>
    <div class="it"><div class="n"><b class="gr">25<small>años</small></b></div><i class="bar"></i><div class="l">de experiencia<br>como entrenador</div></div>
    <div class="it"><div class="n"><b class="gr">134</b><span class="stars">★★★★★</span></div><i class="bar"></i><div class="l">reseñas de 5 estrellas<br>en Google</div></div>
    <div class="it"><div class="n"><b class="gr">140<small>m²</small></b></div><i class="bar"></i><div class="l">de sala,<br>solo para ti</div></div>
  </div>
  <div class="fig r"><img src="escudo-1a1.png" alt=""></div>
</div></div>

</body></html>
